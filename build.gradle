buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'com.guardsquare:proguard-gradle:7.5.0'
    }
}

plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '9.0.0-beta15'
}

import proguard.gradle.ProGuardTask

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
     
    exclusiveContent {
        forRepository {
            maven { url "https://maven.firstdark.dev/releases" }
        }
        filter {
            includeGroup "dev.firstdark.discordrpc"
        }
    }
    mavenCentral()
    maven { url "https://jitpack.io" }
    maven { url "https://maven.meteordev.org/releases" }
    maven { url "https://maven.meteordev.org" }
}

dependencies {
    minecraft("com.mojang:minecraft:${project.minecraft_version}")
    mappings("net.fabricmc:yarn:${project.yarn_mappings}:v2")
    modImplementation("net.fabricmc:fabric-loader:${project.loader_version}")
    modImplementation("net.fabricmc.fabric-api:fabric-api:${project.fabric_version}")

    implementation(shadow("dev.redstones.mediaplayerinfo:media-player-info:0.1.0"))
    implementation("com.google.code.gson:gson:2.10.1")
    implementation(shadow("dev.firstdark.discordrpc:discord-rpc:1.0.3"))
    implementation "net.java.dev.jna:jna:5.14.0"
    implementation "net.java.dev.jna:jna-platform:5.14.0"
    include implementation("meteordevelopment:orbit:0.2.3")
    include implementation("javazoom:jlayer:1.0.1")
    compileOnly("org.projectlombok:lombok:1.18.38")
    annotationProcessor("org.projectlombok:lombok:1.18.38")
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (21 >= 10 || JavaVersion.current().isJava10Compatible()) it.options.release.set(21)
}

java {
    def javaVersion = JavaVersion.toVersion(21)
    if (JavaVersion.current() < javaVersion) toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

sourceSets {
    main {
        java {
            exclude 'discordrpc/**'
        }
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

shadowJar {
    exclude("org/objectweb/**")
    configurations = [project.configurations.shadow]
    archiveClassifier.set("dev")
}

 
 
 
 
 
task proguardJar(type: ProGuardTask) {
    dependsOn shadowJar

    injars shadowJar.archiveFile
    outjars layout.buildDirectory.file("libs/${project.archives_base_name}-obf.jar")

     
    libraryjars configurations.runtimeClasspath
    libraryjars "${System.getProperty('java.home')}/jmods"

    configuration file('proguard-rules.pro')
}

remapJar {
    dependsOn proguardJar
    inputFile = layout.buildDirectory.file("libs/${project.archives_base_name}-obf.jar").get().asFile
}